name: Kita specs

on:
  push:
    branches: ['kita/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm i
      - name: ESLint + vitest on Kita-touched frontend
        run: >-
          pnpm exec eslint
          app/javascript/dashboard/api/kitaConnections.js
          app/javascript/dashboard/helper/kitaConnect.js
          app/javascript/dashboard/helper/specs/kitaConnect.spec.js
          app/javascript/dashboard/components-next/kita/*.vue
          app/javascript/dashboard/components-next/kita/specs/*.js
          app/javascript/dashboard/composables/useKitaConnections.js
          app/javascript/dashboard/components/widgets/conversation/ReplyBox.vue
          app/javascript/dashboard/components-next/message/helpers/messageSide.js
          app/javascript/dashboard/components-next/message/helpers/specs/messageSide.spec.js
          app/javascript/dashboard/components-next/message/helpers/messageLayout.js
          app/javascript/dashboard/components-next/message/helpers/specs/messageLayout.spec.js
          app/javascript/dashboard/components-next/message/specs/MessageLayout.spec.js
          app/javascript/dashboard/components-next/message/MessageMeta.vue
          app/javascript/dashboard/components-next/message/bubbles/Base.vue
          app/javascript/dashboard/components-next/message/constants.js
          app/javascript/dashboard/api/kitaCustomers.js
          app/javascript/dashboard/components-next/kita/customersHelper.js
          app/javascript/dashboard/routes/dashboard/customers/routes.js
          app/javascript/dashboard/routes/dashboard/dashboard.routes.js
          app/javascript/dashboard/components-next/sidebar/Sidebar.vue
          app/javascript/dashboard/api/kitaThreads.js
          app/javascript/dashboard/composables/useKitaThreads.js
          app/javascript/dashboard/helper/kitaThreads.js
          app/javascript/dashboard/helper/specs/kitaThreads.spec.js
          app/javascript/dashboard/components/widgets/conversation/ConversationBox.vue
          app/javascript/dashboard/routes/dashboard/conversation/ConversationView.vue
          app/javascript/dashboard/components-next/message/Message.vue
          app/javascript/dashboard/components-next/message/MessageList.vue
          app/javascript/dashboard/components-next/message/MessageSenderAvatar.vue
          app/javascript/dashboard/components-next/sidebar/SidebarProfileMenu.vue
          app/javascript/dashboard/routes/dashboard/Dashboard.vue
          app/javascript/shared/constants/busEvents.js
          app/javascript/dashboard/composables/useKitaPlatformName.js
          app/javascript/dashboard/store/modules/kitaCustomers.js
          app/javascript/dashboard/store/index.js
          app/javascript/dashboard/components-next/message/bubbles/Text/Index.vue
          app/javascript/dashboard/api/kitaChannelLinks.js
          app/javascript/dashboard/helper/kitaLanding.js
          app/javascript/dashboard/helper/specs/kitaLanding.spec.js
          app/javascript/dashboard/routes/dashboard/conversation/conversation.routes.js
          app/javascript/dashboard/components/widgets/conversation/ConversationCard.vue
          app/javascript/dashboard/components/widgets/conversation/ConversationHeader.vue
          && pnpm exec vitest run app/javascript/dashboard/helper/specs/kitaConnect.spec.js
          app/javascript/dashboard/helper/specs/kitaThreads.spec.js
          app/javascript/dashboard/helper/specs/kitaLanding.spec.js
          app/javascript/dashboard/components-next/message app/javascript/dashboard/components-next/kita
          app/javascript/dashboard/components/widgets/conversation
      - name: Bridge tests
        run: cd kita-bridges && npm test
      - name: Grip sync tests
        run: cd kita-grip-sync && npm test
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Strip enterprise code (production runs with DISABLE_ENTERPRISE)
        run: rm -rf enterprise spec/enterprise
      - run: bundle exec rake db:create db:schema:load
      - name: Kita specs + the upstream OAuth callback spec
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: >-
          bundle exec rspec spec/controllers/kita spec/controllers/devise/omniauth_callbacks_controller_spec.rb
          spec/controllers/public/api/v1/inbox/messages_controller_spec.rb
      - name: Rubocop on Kita-touched Ruby
        run: >-
          bundle exec rubocop app/controllers/devise_overrides/omniauth_callbacks_controller.rb spec/controllers/kita
          lib/kita app/controllers/kita app/controllers/api/v1/kita app/controllers/concerns/kita app/controllers/api/v1/accounts/kita
          app/models/kita db/migrate/20260924000000_create_kita_threads.rb
          db/migrate/20260925000000_add_ticket_fields_to_kita_threads.rb
          app/controllers/public/api/v1/inboxes/messages_controller.rb
