# Kita support desk (support.internal.kita.ai). Secrets live in .env, never here.
services:
  base: &base
    image: ghcr.io/carmelvl/kita-support:latest
    env_file: .env
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on: [postgres, redis]
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DISABLE_ENTERPRISE=true
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: unless-stopped

  sidekiq:
    <<: *base
    depends_on: [postgres, redis]
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DISABLE_ENTERPRISE=true
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data

  # Slack / Teams / Viber <-> Chatwoot bridge (see kita-bridges/README.md). Secrets in kita-bridges/.env.
  bridges:
    build: ./kita-bridges
    restart: unless-stopped
    depends_on: [rails]
    env_file:
      - path: kita-bridges/.env
        required: false # bridge idles (all platforms disabled) until configured
    environment:
      - CHATWOOT_BASE_URL=https://support.internal.kita.ai
      - BRIDGE_DB_PATH=/data/bridges.sqlite
    volumes:
      - bridges_data:/data

  # Chatwoot -> Grip support sync + automatic tickets (see kita-grip-sync/README.md). Secrets in kita-grip-sync/.env.
  grip-sync:
    build: ./kita-grip-sync
    restart: unless-stopped
    depends_on: [rails]
    env_file:
      - path: kita-grip-sync/.env
        required: false # rejects every webhook until CHATWOOT_WEBHOOK_SECRET is configured
    environment:
      - CHATWOOT_BASE_URL=https://support.internal.kita.ai
      - GRIP_SYNC_DB_PATH=/data/grip-sync.sqlite
    volumes:
      - grip_sync_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [rails, bridges, grip-sync]
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile.kita:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
  storage_data:
  postgres_data:
  redis_data:
  bridges_data:
  grip_sync_data:
