# Slack app manifest for the Kita support bridge.
# api.slack.com/apps > Create New App > From an app manifest > paste this.
display_information:
  name: Kita
  description: Talk to the Kita team from your shared Slack channel.
features:
  bot_user:
    display_name: Kita
    always_online: true
oauth_config:
  # Per-agent "Connect your Slack account" (replies post as the real person).
  redirect_urls:
    - https://support.internal.kita.ai/bridges/connect/slack/callback
  scopes:
    user:
      - chat:write           # post replies as the agent
      - files:write          # attachments as the agent
    bot:
      - channels:history     # message events in public / Slack Connect channels
      - groups:history       # message events in private shared channels
      - im:history
      - mpim:history
      - chat:write           # post agent replies into the thread
      - chat:write.customize # fallback: bot posts with the agent's name + avatar
      - files:read           # copy customer attachments into the desk
      - files:write          # send agent attachments as native Slack files
      - users:read           # display names
      - users:read.email     # match a connecting Slack account to the agent's desk email; team sync users.lookupByEmail
      - channels:read        # team sync: conversations.members (public / Slack Connect)
      - groups:read          # team sync: conversations.members (private shared)
      - channels:manage      # team sync: conversations.invite (public / Slack Connect)
      - groups:write         # team sync: conversations.invite (private shared)
settings:
  event_subscriptions:
    request_url: https://support.internal.kita.ai/bridges/slack/events
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - member_joined_channel   # history backfill when the Kita bot is added to a channel
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
